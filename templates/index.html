<!DOCTYPE html>

<title>AI Chatbot for College Helpdesk</title>

<style>

body{
    margin:0;
    font-family:"Segoe UI",Arial;
    background:#343541;
    color:white;
}

.header{
    background:#202123;
    padding:18px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    letter-spacing:1px;
}

.languageBar{
    background:#2d2f39;
    text-align:center;
    padding:10px;
}

.languageBar button{
    margin:5px;
    background:#19c37d;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

#chatbox{
    height:62vh;
    overflow-y:auto;
    padding:20px;
    display:flex;
    flex-direction:column;
}

.message{
    display:flex;
    margin:10px 0;
}

.user{
    justify-content:flex-end;
}

.bot{
    justify-content:flex-start;
}

.bubble{
    max-width:70%;
    padding:14px;
    border-radius:14px;
    line-height:1.7;
    font-size:14px;
    white-space:pre-wrap;
}

.user .bubble{
    background:#19c37d;
    color:black;
}

.bot .bubble{
    background:#444654;
}

#inputArea{
    position:fixed;
    bottom:65px;
    width:100%;
    background:#40414f;
    padding:10px;
    display:flex;
    gap:5px;
}

input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    font-size:15px;
}

button{
    padding:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

#keyPoints{
    position:fixed;
    bottom:0;
    width:100%;
    background:#202123;
    padding:10px;
    text-align:center;
}

#keyPoints button{
    margin:5px;
    background:#444654;
    color:white;
}

.name{
    color:#19c37d;
    font-weight:bold;
    cursor:pointer;
}

#popup{
    display:none;
    position:fixed;
    top:0;
    width:100%;
    height:100%;
    background:black;
    z-index:999;
}

#popup iframe{
    width:100%;
    height:92%;
}

#popup button{
    width:100%;
    background:red;
    color:white;
    padding:12px;
}

</style>
</head>

🤖 AI Chatbot for College Helpdesk

<div class="languageBar">

<button onclick="setLanguage('english')">English</button>

<button onclick="setLanguage('telugu')">తెలుగు</button>

</div>

<div id="chatbox"></div>

<div id="inputArea">

<input
id="text"

onkeypress="handleKey(event)"
>

<button onclick="sendMessage()">➤</button>
<button onclick="startVoice()">🎤</button>
<button onclick="stopVoice()">⛔</button>
<button onclick="speakText()">🔊</button>
<button onclick="clearChat()">🗑️</button>

<div id="keyPoints">

<button onclick="quickSend('placement')">Placement</button>
<button onclick="quickSend('fees')">Fees</button>
<button onclick="quickSend('admission')">Admission</button>

<iframe id="frame"></iframe>

<div style="display:flex; gap:10px; padding:10px; background:black;">

<button onclick="downloadOffer()" 
style="flex:1; background:#19c37d; color:black;">
Download Offer Letter
</button>

<button onclick="closePopup()" 
style="flex:1; background:red; color:white;">
Close
</button>

</div>
</div>

window.onload = function(){

addMessage(
translations[currentLanguage].welcome,
"bot"
);

}

function setLanguage(lang){

currentLanguage = lang;

addMessage(
translations[lang].welcome,
"bot"
);

}

function addMessage(message, sender){

let chatbox = document.getElementById("chatbox");

let msg = document.createElement("div");
msg.classList.add("message", sender);

let bubble = document.createElement("div");
bubble.classList.add("bubble");

bubble.innerHTML = makeClickable(message);

msg.appendChild(bubble);
chatbox.appendChild(msg);

chatbox.scrollTop = chatbox.scrollHeight;
}

function makeClickable(text){

const students = [

["Abhilash D R","abhilash.pdf"],
["Sandeep Ashok","sandeep.pdf"],
["Geeta Jagadish Malali","geeta.pdf"],
["Vamshi P R","vamshi.pdf"],
["Bharathi H V","Bharathi.pdf"]

];

students.forEach(s=>{

text = text.replaceAll(

s[0],

`<span class='name' onclick="openOffer('${s[1]}')">${s[0]}</span>`

);

});

return text;
}

function generateReply(msg){

msg = msg.toLowerCase();

if(msg.includes("course"))
return translations[currentLanguage].courses;

if(msg.includes("fee"))
return translations[currentLanguage].fees;

if(msg.includes("admission"))
return translations[currentLanguage].admission;

if(msg.includes("placement"))
return translations[currentLanguage].placement;

if(msg.includes("facilities"))
return translations[currentLanguage].facilities;

return "Please ask queries related to college information.";
}

function sendMessage(){

let input = document.getElementById("text");
let msg = input.value;

if(!msg) return;

addMessage(msg,"user");

input.value = "";

let response = generateReply(msg);

lastResponse = response;

addMessage(response,"bot");
}

function quickSend(text){

document.getElementById("text").value = text;
sendMessage();
}

function handleKey(e){

if(e.key==="Enter")
sendMessage();

}

function clearChat(){

document.getElementById("chatbox").innerHTML="";

}

let recognition;

function startVoice(){

if (!("webkitSpeechRecognition" in window)) {

alert("Use Google Chrome");
return;

}

recognition = new webkitSpeechRecognition();

recognition.lang="en-IN";

recognition.start();

recognition.onresult = function(e){

document.getElementById("text").value =
e.results[0][0].transcript;

sendMessage();

};

}

function stopVoice(){

if(recognition){

recognition.stop();

}

window.speechSynthesis.cancel();

}

function speakText(){

if(!lastResponse) return;

window.speechSynthesis.cancel();

let speech = new SpeechSynthesisUtterance();

speech.text = lastResponse;

speech.lang = "en-IN";

window.speechSynthesis.speak(speech);

}

function openOffer(file){

document.getElementById("popup").style.display="block";

document.getElementById("frame").src="/static/offers/"+file;

}

function closePopup(){

document.getElementById("popup").style.display="none";

}

function downloadOffer(){

let file = document.getElementById("frame").src;

let a = document.createElement("a");

a.href = file;

a.download = "OfferLetter.pdf";

document.body.appendChild(a);

a.click();

document.body.removeChild(a);

}
